<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#ff5a6e"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#064e3b" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- подписи: слева целые, справа стёрты в прозрачность -->
  <g fill="#fff">
    <rect x="30" y="50" width="62" height="12" rx="6"/>
    <rect x="30" y="78" width="48" height="12" rx="6"/>
    <rect x="30" y="106" width="34" height="12" rx="6"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round">
    <rect x="93" y="51" width="54" height="10" rx="5"/>
    <rect x="79" y="79" width="46" height="10" rx="5"/>
    <rect x="65" y="107" width="40" height="10" rx="5"/>
  </g>
  <!-- ластик -->
  <g transform="rotate(38 112 102)" filter="url(#sh)">
    <rect x="94" y="60" width="36" height="84" rx="10" fill="#fff"/>
    <path d="M94 116h36v18a10 10 0 0 1-10 10h-16a10 10 0 0 1-10-10z" fill="url(#tip)"/>
    <rect x="94" y="112" width="36" height="6" fill="#e5e7eb"/>
  </g>
  <path d="M140 132l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/>
